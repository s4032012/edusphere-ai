name: EduSphere CI
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: edusphere
          POSTGRES_USER: edusphere
          POSTGRES_PASSWORD: ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U edusphere -d edusphere"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_ENGINE: postgres
      POSTGRES_DB: edusphere
      POSTGRES_USER: edusphere
      POSTGRES_PASSWORD: ci-only
      POSTGRES_HOST: localhost
      DJANGO_DEBUG: '1'
      DJANGO_SECRET_KEY: ci-only-synthetic-secret-key-at-least-32-characters
    defaults: {run: {working-directory: backend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13', cache: pip, cache-dependency-path: backend/requirements.txt}
      - run: python -m pip install -r requirements.txt
      - run: python ../scripts/sprint7_static_audit.py
      - run: python -m unittest discover -s ../scripts/tests -v
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate --noinput
      - run: python manage.py test apps.academics.tests apps.access.tests apps.attendance.tests apps.grades.tests apps.homework.tests apps.communications.tests apps.dashboard.tests apps.regression.tests
      - run: python manage.py seed_demo
      - run: python manage.py seed_demo
      - run: python ../scripts/sprint7_probe_drill.py
      - name: Read-only HTTP smoke against synthetic API
        run: |
          python manage.py runserver 127.0.0.1:8000 --noreload > "$RUNNER_TEMP/sprint7-http.log" 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/readyz/ > /dev/null; then break; fi
            sleep 1
          done
          python ../scripts/sprint7_smoke.py
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: pnpm}
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:contracts
      - run: node scripts/check_native_text.mjs
      - run: node --test scripts/tests/native_text.test.mjs
      - run: pnpm typecheck
      - run: pnpm build:web
      - run: pnpm expo:doctor
      - run: pnpm build:mobile
