name: EduSphere CI
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: edusphere
          POSTGRES_USER: edusphere
          POSTGRES_PASSWORD: ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U edusphere -d edusphere"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_ENGINE: postgres
      POSTGRES_DB: edusphere
      POSTGRES_USER: edusphere
      POSTGRES_PASSWORD: ci-only
      POSTGRES_HOST: localhost
      DJANGO_DEBUG: '1'
      DJANGO_SECRET_KEY: ci-only-synthetic-secret-key-at-least-32-characters
    defaults: {run: {working-directory: backend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13', cache: pip, cache-dependency-path: backend/requirements.txt}
      - run: python -m pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate --noinput
      - run: python manage.py test apps.academics.tests apps.access.tests
      - run: python manage.py seed_demo
      - run: python manage.py seed_demo
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: pnpm}
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:contracts
      - run: pnpm typecheck
      - run: pnpm build:web
      - run: pnpm expo:doctor
      - run: pnpm build:mobile
