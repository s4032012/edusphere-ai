# DEVELOPMENT ONLY: Docker starts the existing Django API + PostgreSQL.
# Webs and Expo apps run with pnpm outside Compose. Never put student data here.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: edusphere
      POSTGRES_USER: edusphere
      POSTGRES_PASSWORD: dev-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edusphere -d edusphere"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - edusphere_pg:/var/lib/postgresql/data
  backend:
    build: ./backend
    environment:
      DB_ENGINE: postgres
      POSTGRES_DB: edusphere
      POSTGRES_USER: edusphere
      POSTGRES_PASSWORD: dev-only
      POSTGRES_HOST: db
      DJANGO_DEBUG: "1"
      DJANGO_SECRET_KEY: dev-only-unsafe-change-before-production
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:5174,http://localhost:5175,http://127.0.0.1:5173,http://127.0.0.1:5174,http://127.0.0.1:5175
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend:/app
    # Apply versioned migrations; never generate schema at startup.
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
volumes:
  edusphere_pg:
